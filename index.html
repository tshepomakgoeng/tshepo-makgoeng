<!DOCTYPE html>
<html>
<head>
  <title>Happy Valentine’s Day ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.15);
      padding: 30px;
      border-radius: 20px;
      max-width: 360px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0,0,0,0.2);
    }

    h1 { font-size: 26px; }
    .name { font-size: 22px; font-weight: bold; color: #fff0f3; margin-bottom: 10px; }
    p { font-size: 17px; line-height: 1.6; }

    button {
      margin-top: 20px;
      padding: 12px 22px;
      border: none;
      border-radius: 25px;
      background: white;
      color: #ff4d6d;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #ffe3ea; }

    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
    }
    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-110vh); opacity: 0; }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Happy Valentine’s Day ❤️</h1>
    <div class="name">Tshepiso R. Motswaledi</div>

    <p>
      To the most beautiful woman in my life,<br><br>
      Every moment with you feels like magic.
      Your smile is my favorite place,
      and your love is my greatest gift.
    </p>

    <button onclick="showLove()">Click for a surprise 💌</button>
    <p id="surprise"></p>
  </div>

  <script>
    function showLove() {
      for (let i = 0; i < 25; i++) {
        createHeart();
      }

      // 2-second delayed surprise message with pink flash
      setTimeout(() => {
        const surprise = document.getElementById("surprise");
        surprise.innerHTML = "I choose you, Tshepiso. Today, tomorrow, and always. 💖";
        surprise.style.transition = "0.3s";
        surprise.style.color = "#ffb6c1"; // soft pink flash
        setTimeout(() => { surprise.style.color = "white"; }, 500);
      }, 2000);
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (3 + Math.random() * 3) + "s";
      document.body.appendChild(heart);
      setTimeout(() => { heart.remove(); }, 6000);
    }
  </script>

</body>
</html>
